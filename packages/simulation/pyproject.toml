[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teevra-simulation"
version = "0.1.0"
description = "TEEVRA AI deterministic demo factory data"
requires-python = ">=3.11"
dependencies = [
    "teevra-shared-schemas>=0.1.0",
]

[tool.setuptools]
packages = ["teevra_simulation"]

[tool.setuptools.package-dir]
teevra_simulation = "teevra_simulation"
