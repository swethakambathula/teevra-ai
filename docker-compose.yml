services:
  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONPATH=/app/packages/shared-schemas:/app/packages/simulation:/app/packages/a2a:/app/services/scheduler-engine:/app/mcp/common
    depends_on:
      - recovery-agent
      - heat-guardian-agent
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 3

  recovery-agent:
    build:
      context: ..
      dockerfile: services/recovery-agent/Dockerfile
    ports:
      - "8072:8072"
    environment:
      - PORT=8072
      - PYTHONPATH=/app/packages/shared-schemas:/app/packages/simulation:/app/packages/a2a:/app/services/scheduler-engine:/app/mcp/common
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8072/.well-known/agent.json', timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 3

  heat-guardian-agent:
    build:
      context: ..
      dockerfile: services/heat-guardian-agent/Dockerfile
    ports:
      - "8071:8071"
    environment:
      - PORT=8071
      - PYTHONPATH=/app/packages/shared-schemas:/app/packages/simulation:/app/packages/a2a:/app/mcp/common
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8071/.well-known/agent.json', timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ../apps/dashboard:/app
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - api-gateway

volumes:
  node_modules:
